<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2233'/%3E%3Cpath d='M32 13a5 5 0 1 1 5 5c-3 0-5 2-5 4v2' fill='none' stroke='%23e0b458' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M10 44 32 26l22 18z' fill='none' stroke='%23e0b458' stroke-width='3.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#a8791e;--side-base:#1b2233;--gold:#e0b458;--bg:#f4f5f7;--surf:#fff;--surf2:#f7f8fa;--ink:#161c2b;--mut:#5e6677;--line:#e4e6eb;--line2:#d2d6de;--red:#c0392b;--amb:#b7791f;--grn:#2f855a;--blu:#2b6cb0;--accx:color-mix(in srgb,var(--acc) 82%,#000);--acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);--r:12px;--sp:1;--fs:14px;--side:var(--side-base);--side-ink:#e9ecf2;--side-mut:color-mix(in srgb,var(--side-ink) 55%,transparent);--side-on:color-mix(in srgb,var(--gold) 16%,transparent);--side-on-ink:#fff;--side-bd:transparent;--disp:"Cormorant Garamond",Georgia,"Times New Roman",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--surf:#171b24;--surf2:#1c212c;--ink:#e8ebf1;--mut:#9aa2b2;--line:#262c38;--line2:#333a48;--accx:color-mix(in srgb,var(--acc) 58%,#fff);--acc-soft:color-mix(in srgb,var(--acc) 24%,transparent);--side:color-mix(in srgb,var(--side-base) 70%,#000);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--surf:#171b24;--surf2:#1c212c;--ink:#e8ebf1;--mut:#9aa2b2;--line:#262c38;--line2:#333a48;--accx:color-mix(in srgb,var(--acc) 58%,#fff);--acc-soft:color-mix(in srgb,var(--acc) 24%,transparent);--side:color-mix(in srgb,var(--side-base) 70%,#000);color-scheme:dark}
:root[data-side="accent"]{--side:color-mix(in srgb,var(--acc) 78%,#000)}
:root[data-side="light"]{--side:var(--surf);--side-ink:var(--ink);--side-mut:var(--mut);--side-on:var(--acc-soft);--side-on-ink:var(--accx);--side-bd:var(--line)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font:500 var(--fs)/1.5 Manrope,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--accx);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
h1{font-family:var(--disp);font-size:2.15em;font-weight:700;letter-spacing:-.005em;line-height:1.1;margin:0}
h2{font-size:1.06em;font-weight:750;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:.98em;font-weight:700;margin:14px 0 6px}
small{font-size:.84em}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
/* Barre latérale */
.sb{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px 14px;border-right:1px solid var(--side-bd)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 8px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:100%;height:100%;display:block}.logo img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.brand b{display:block;font-family:var(--disp);font-size:1.42em;font-weight:700;line-height:1;letter-spacing:.005em}.brand small{display:block;color:var(--side-mut);font-weight:500;margin-top:3px;font-size:.78em}
.sb .brand b{color:var(--gold)}:root[data-side="light"] .sb .brand b{color:var(--accx)}
.grp{font-size:.78em;color:var(--side-mut);margin:18px 10px 5px;font-weight:700}
.it{display:flex;gap:11px;align-items:center;padding:calc(8px*var(--sp)) 10px;border-radius:calc(var(--r) - 4px);color:var(--side-ink);cursor:pointer;font-weight:600;margin-top:1px;position:relative}
.it:hover{background:color-mix(in srgb,var(--side-ink) 8%,transparent);text-decoration:none}
.it.on{background:var(--side-on);color:var(--side-on-ink)}
.it.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.it .c{margin-left:auto;background:var(--red);color:#fff;font-size:.72em;border-radius:99px;padding:0 7px;font-weight:700}
.snav{margin:2px 0 6px 30px;border-left:1px solid color-mix(in srgb,var(--side-ink) 16%,transparent);padding-left:6px}
.snav a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;color:var(--side-mut);font-weight:600;font-size:.9em;cursor:pointer}
.snav a:hover{color:var(--side-ink);text-decoration:none;background:color-mix(in srgb,var(--side-ink) 7%,transparent)}.snav a.on{color:var(--side-on-ink)}
.snav i{width:7px;height:7px;border-radius:50%;flex:none}
.sbf{margin-top:auto;padding-top:16px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:color-mix(in srgb,var(--side-ink) 6%,transparent)}
.who b{display:block;font-size:.92em;line-height:1.2}.who small{color:var(--side-mut);display:block;line-height:1.3}
.who button{margin-left:auto;background:none;border:0;color:var(--side-mut);cursor:pointer;padding:6px;border-radius:8px}.who button:hover{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 10%,transparent)}
/* Barre du haut */
.mainw{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .tt{font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.svi{display:inline-flex;align-items:center;gap:6px;font-size:.82em;color:var(--mut);font-weight:600;white-space:nowrap}.svi i{width:7px;height:7px;border-radius:50%;background:var(--grn)}.svi.busy i{background:var(--amb)}
.g{background:none;border:1px solid transparent;color:var(--ink);cursor:pointer;padding:8px;border-radius:calc(var(--r) - 4px);display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;position:relative}
.g:hover{background:var(--surf);border-color:var(--line)}
.burger{display:none}
.nb{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.uchip{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:4px 6px 4px 4px;border-radius:99px}
.uchip:hover{background:var(--surf)}
.uchip b{display:block;font-size:.9em;line-height:1.15;text-align:left}.uchip small{display:block;color:var(--mut);line-height:1.2;text-align:left}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--accx);display:grid;place-items:center;font-weight:800;font-size:.8em;flex:none}
.nw{position:relative}
.np{display:none;position:absolute;right:0;top:calc(100% + 8px);width:min(390px,92vw);background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(8,14,28,.18);z-index:30;max-height:70vh;overflow:auto}
.np.on{display:block}
.nph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
main{padding:calc(26px*var(--sp)) 28px 56px;width:100%;max-width:1440px}
/* Composants */
.ph{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:calc(20px*var(--sp))}
.ph p{color:var(--mut);margin:6px 0 0;max-width:72ch}
.pa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:calc(16px*var(--sp)) calc(18px*var(--sp));margin-bottom:16px}
.ch2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin:0 0 16px}
.k>div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:calc(13px*var(--sp)) 16px}
.k span{color:var(--mut);font-size:.86em;display:block;font-weight:600}
.k strong{font-size:clamp(1.05em,1.6vw,1.38em);font-weight:800;letter-spacing:-.015em;display:block;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.k small{color:var(--mut);display:block}
.k>div.hl{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}.k>div.hl strong{color:var(--red)}
.k>div.ok strong{color:var(--grn)}
.w{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:calc(10px*var(--sp)) 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.8em;color:var(--mut);font-weight:700;background:var(--surf2)}
tbody tr:hover td{background:color-mix(in srgb,var(--acc) 4%,transparent)}
tbody tr:last-child td{border-bottom:0}
.t{text-align:left}
tfoot td{background:var(--surf2);font-weight:800;border-top:1px solid var(--line2);border-bottom:0}
tr.sub td{background:var(--surf2);font-size:.92em;color:var(--mut)}
tr.gh td{background:var(--surf2);font-weight:800;font-size:.84em;color:var(--mut);text-align:left}
td small{color:var(--mut)}
.b,.o{border-radius:calc(var(--r) - 4px);padding:calc(8px*var(--sp) + 1px) 14px;cursor:pointer;font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.3}
.b{background:var(--acc);color:#fff;border:1px solid var(--acc)}.b:hover{filter:brightness(1.07)}
.o{background:var(--surf);color:var(--ink);border:1px solid var(--line2)}.o:hover{border-color:var(--acc)}
.o.on{background:var(--acc-soft);color:var(--accx);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.o.sm,.b.sm{padding:5px 10px;font-size:.88em}
.dng{color:var(--red)}.o.dng:hover{border-color:var(--red)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surf2);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:calc(6px*var(--sp) + 1px) 12px;border-radius:calc(var(--r) - 5px);font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,select,textarea{font:inherit;font-weight:500;padding:calc(7px*var(--sp) + 1px) 10px;border:1px solid var(--line2);border-radius:calc(var(--r) - 4px);background:var(--surf);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0;box-shadow:0 0 0 3px var(--acc-soft)}
input[readonly]{background:var(--surf2);color:var(--mut)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:17px;height:17px;padding:0}
input[type=color]{padding:2px;height:38px;width:56px;cursor:pointer}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0 10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.84em;color:var(--mut);font-weight:600}
.col{display:flex;flex-direction:column;gap:12px;margin:8px 0}
.col label{display:flex;flex-direction:column;gap:5px;font-size:.88em;color:var(--mut);font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;margin:6px 0 12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:.84em;color:var(--mut);font-weight:600}
.fg .w2{grid-column:span 2}
.ck{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:7px!important;color:var(--ink)!important;font-weight:600!important;font-size:.92em!important;padding:4px 10px 4px 6px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--surf)}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:.8em;padding:2px 9px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);font-weight:700;color:var(--mut);white-space:nowrap;line-height:1.5}
.bd.r{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red);border-color:transparent}
.bd.a{background:color-mix(in srgb,var(--amb) 14%,transparent);color:var(--amb);border-color:transparent}
.bd.gr{background:color-mix(in srgb,var(--grn) 13%,transparent);color:var(--grn);border-color:transparent}
.bd.bl{background:color-mix(in srgb,var(--blu) 13%,transparent);color:var(--blu);border-color:transparent}
.bd.ac{background:var(--acc-soft);color:var(--accx);border-color:transparent}
.bd svg{width:12px;height:12px;flex:none}
.warn{color:var(--red);font-weight:700}.pos{color:var(--grn);font-weight:700}
.msg{color:var(--red);font-weight:600;min-height:1.2em;margin:4px 0}
.mut{color:var(--mut)}
.d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cd{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);vertical-align:-2px;flex:none}
.note{background:var(--surf2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:calc(var(--r) - 4px);padding:12px 14px;margin:0 0 16px}
.note.r{border-left-color:var(--red)}.note.a{border-left-color:var(--amb)}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--mut);margin-bottom:16px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.g3>.card,.g2>.card{margin-bottom:14px}
.ch{display:flex;align-items:flex-end;gap:14px;height:180px;overflow-x:auto;padding-top:8px}
.ch>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.78em;color:var(--mut);text-align:center}
.ch p{display:flex;align-items:flex-end;gap:3px;margin:0 0 6px;flex:1}.ch i{width:14px;border-radius:4px 4px 0 0;display:block}
.bar{height:9px;background:var(--surf2);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:90px;flex:1}.bar i{display:block;height:100%;background:var(--acc)}
.r{display:flex;gap:10px;align-items:center;margin:8px 0}.r>span:first-child{width:180px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.lr:last-child{border-bottom:0}
ul{margin:4px 0 8px;padding-left:20px}li{margin:3px 0}
.md{position:fixed;inset:0;background:rgba(10,14,26,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.md>.card{box-shadow:0 30px 80px rgba(0,0,0,.3);max-width:780px;width:100%;max-height:92vh;overflow:auto;margin:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r);z-index:60;max-width:80vw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mut);font-weight:600;margin-bottom:8px}.crumb a{color:var(--mut)}.crumb a:hover{color:var(--accx)}
/* Tâches */
.tk{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}.tk:last-child{border-bottom:0}
.tk .tx{flex:1;min-width:0}.tk .tx b{display:block;font-weight:700}.tk.done .tx b{text-decoration:line-through;color:var(--mut)}
.tk .mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
/* Notifications */
.nt{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}.nt:last-child{border-bottom:0}
.nt:hover{background:var(--surf2)}.nt .dt{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.nt b{display:block;font-weight:700;font-size:.95em}.nt small{color:var(--mut)}.nt.rd{opacity:.6}
.card .nt{padding:10px 2px}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}
.hero h1{font-size:2.5em}.hero p{margin:6px 0 0;color:var(--mut)}
/* Tableau de bord : chiffres d'affaires */
.ca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:0}
.ca button{position:relative;text-align:left;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0;padding:14px 16px 16px;cursor:pointer;min-width:0}
.ca button:hover{border-color:var(--line2)}
.ca button span{display:block;font-weight:700;color:var(--mut);font-size:.9em}
.ca button strong{display:block;font-size:clamp(1.15em,2.1vw,1.7em);font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.ca button small{display:block;color:var(--mut)}
.ca button em{font-style:normal;font-weight:700}
.ca button.on{background:var(--side-base);border-color:var(--side-base);color:#fff}
.ca button.on span,.ca button.on small{color:color-mix(in srgb,#fff 70%,transparent)}
.ca button.on strong{color:var(--gold)}
.ca button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold)}
.cap{background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--side-base);border-radius:0 0 var(--r) var(--r);padding:16px 18px 18px;margin-bottom:16px}
.cap .ch2 h2{margin:0;font-size:1.12em}
.leg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--mut);font-size:.86em;font-weight:600}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;overflow-x:auto;margin-top:6px}.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .bg rect.hv{fill:transparent;cursor:pointer}.chart .bg g:hover rect.hv{fill:color-mix(in srgb,var(--acc) 8%,transparent)}
.rd{min-height:1.4em;font-size:.9em;color:var(--mut);font-weight:600;margin-top:4px}
.ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0 0;background:var(--line);gap:1px}
.ks>div{background:var(--surf);padding:12px 14px}
.ks span{display:block;color:var(--mut);font-size:.84em;font-weight:600}
.ks strong{display:block;font-size:1.15em;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ks small{display:block;color:var(--mut)}
.ks .ca1 strong{color:var(--accx)}.ks .neg strong{color:var(--red)}.ks .pos2 strong{color:var(--grn)}

function sha256js(str){const b=unescape(encodeURIComponent(str)),K=[],H=[];let n=2,c=0;const f=x=>(x-(x|0))*4294967296|0;while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i==0){p=0;break}if(p){if(c<8)H[c]=f(Math.pow(n,1/2));K[c++]=f(Math.pow(n,1/3))}n++}const w=[],l=b.length*8;let m=b+'\x80';while(m.length%64-56)m+='\x00';for(let i=0;i<m.length;i++)w[i>>2]|=m.charCodeAt(i)<<((3-i)%4)*8;w[w.length]=(l/4294967296)|0;w[w.length]=l|0;const r=(v,k)=>v>>>k|v<<32-k;for(let j=0;j<w.length;j+=16){const W=w.slice(j,j+16);let h=H.slice(0);for(let i=0;i<64;i++){if(i>15){const a=W[i-15],d=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^a>>>3)+W[i-7]+(r(d,17)^r(d,19)^d>>>10))|0}const e=h[4],t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+(e&h[5]^~e&h[6])+K[i]+W[i],a=h[0],t2=(r(a,2)^r(a,13)^r(a,22))+(a&h[1]^a&h[2]^h[1]&h[2]);h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;h.pop()}for(let i=0;i<8;i++)H[i]=(H[i]+h[i])|0}return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}
